# Cache ảnh bản đồ (tile) lấy từ OpenStreetMap: trình duyệt chỉ gọi /maptiles/... của server này,
# máy khách không cần nối được tới tile.openstreetmap.org. Đúng chính sách OSM: có User-Agent định danh, có cache.
# Chính sách OSM: phải gửi Referer đúng (không được xóa). Trình duyệt nào không gửi thì dùng địa chỉ chính website này.
map $http_referer $tile_referer {
  default $http_referer;
  ""      "https://$host/";
}

proxy_cache_path /var/cache/nginx/maptiles levels=1:2 keys_zone=osm_tiles:20m max_size=1g inactive=30d use_temp_path=off;

# Phục vụ frontend (SPA) và chuyển tiếp /api tới API Gateway.
# Môi trường thật: đặt sau HTTPS (Let's Encrypt) – Geolocation API bắt buộc HTTPS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # DNS nội bộ của Docker. Dùng biến trong proxy_pass để nginx phân giải lại tên "gateway"
  # mỗi vài giây; nếu không, nginx nhớ IP cũ và trả 502 sau khi container gateway được tạo lại.
  resolver 127.0.0.11 valid=5s ipv6=off;

  location /api/ {
    set $gateway http://gateway:8080;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    error_page 502 503 504 = @api_unavailable;
  }

  # Ảnh bản đồ: server thử lần lượt OpenStreetMap → Esri → OSM-France. Nhà mạng ở một số nơi chặn kết nối HTTPS tới
  # một số máy chủ (lỗi "peer closed connection in SSL handshake") nên không thể chỉ dựa vào một nguồn.
  # KHÔNG dùng CARTO: nó trả ảnh hợp lệ (HTTP 200) nhưng đóng dấu "API KEY REQUIRED" lên toàn bản đồ.
  # Biến trong proxy_pass để nginx không chết khi khởi động lúc chưa có mạng/DNS.
  location ~ ^/maptiles/(\d+)/(\d+)/(\d+)\.png$ {
    set $tz $1; set $tx $2; set $ty $3;
    resolver 8.8.8.8 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 3s;
    set $up_host tile.openstreetmap.org;
    proxy_pass https://$up_host/$tz/$tx/$ty.png;
    proxy_ssl_server_name on;
    proxy_set_header Host $up_host;
    proxy_set_header User-Agent "HoiAnAudioGuide/1.0 (+https://$host/; Hoi An audio guide tile proxy)";
    proxy_set_header Cookie "";
    proxy_set_header Referer $tile_referer;
    proxy_connect_timeout 3s;
    proxy_read_timeout 6s;
    proxy_intercept_errors on;
    proxy_cache osm_tiles;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Tile-Source $up_host;
    add_header X-Tile-Cache $upstream_cache_status;
    error_page 403 429 500 502 503 504 = @tile_esri;
  }

  location @tile_esri {
    resolver 8.8.8.8 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 3s;
    set $up_host server.arcgisonline.com;
    proxy_pass https://$up_host/ArcGIS/rest/services/World_Street_Map/MapServer/tile/$tz/$ty/$tx;
    proxy_ssl_server_name on;
    proxy_set_header Host $up_host;
    proxy_set_header User-Agent "HoiAnAudioGuide/1.0 (+https://$host/; Hoi An audio guide tile proxy)";
    proxy_set_header Cookie "";
    proxy_set_header Referer $tile_referer;
    proxy_connect_timeout 3s;
    proxy_read_timeout 6s;
    proxy_intercept_errors on;
    proxy_cache osm_tiles;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Tile-Source $up_host;
    add_header X-Tile-Cache $upstream_cache_status;
    error_page 403 429 500 502 503 504 = @tile_osmfr;
  }

  location @tile_osmfr {
    resolver 8.8.8.8 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 3s;
    set $up_host a.tile.openstreetmap.fr;
    proxy_pass https://$up_host/osmfr/$tz/$tx/$ty.png;
    proxy_ssl_server_name on;
    proxy_set_header Host $up_host;
    proxy_set_header User-Agent "HoiAnAudioGuide/1.0 (+https://$host/; Hoi An audio guide tile proxy)";
    proxy_set_header Cookie "";
    proxy_set_header Referer $tile_referer;
    proxy_connect_timeout 3s;
    proxy_read_timeout 6s;
    proxy_intercept_errors on;
    proxy_cache osm_tiles;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Tile-Source $up_host;
    add_header X-Tile-Cache $upstream_cache_status;
  }

  # Gateway không với tới được: trả JSON cùng định dạng lỗi chuẩn thay vì trang HTML "502 Bad Gateway"
  location @api_unavailable {
    default_type "application/json; charset=utf-8";
    add_header Cache-Control "no-store" always;
    return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"Máy chủ tạm thời không khả dụng, vui lòng thử lại sau"}}';
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  # Ảnh địa điểm: thiếu file → 404 ngay (không trả index.html), có file → cho trình duyệt cache 7 ngày.
  location /places/ { try_files $uri =404; expires 7d; add_header Cache-Control "public"; }
  location / { try_files $uri /index.html; }
}
