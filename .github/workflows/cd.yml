name: CD
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { app: gateway, file: docker/service.Dockerfile }
          - { app: auth, file: docker/service.Dockerfile }
          - { app: location, file: docker/service.Dockerfile }
          - { app: content, file: docker/service.Dockerfile }
          - { app: analytics, file: docker/service.Dockerfile }
          - { app: web, file: docker/web.Dockerfile }
          - { app: migrate, file: docker/migrate.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: SERVICE=${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ steps.name.outputs.repo }}/${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ steps.name.outputs.repo }}/${{ matrix.app }}:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    # Chỉ triển khai khi đã cấu hình máy chủ (Settings → Secrets → DEPLOY_HOST…)
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - id: name
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX: ${{ steps.name.outputs.prefix }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          envs: IMAGE_PREFIX,IMAGE_TAG
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/hoian-guide
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            PREV_TAG=$(cat .current_tag 2>/dev/null || echo latest)
            export IMAGE_PREFIX IMAGE_TAG
            docker compose pull
            docker compose run --rm migrate
            docker compose up -d
            # Health check: tối đa 10 lần, cách 6 s; lỗi → rollback về image trước
            for i in $(seq 1 10); do
              if curl -fsS http://localhost:8080/ready > /dev/null; then echo "$IMAGE_TAG" > .current_tag; exit 0; fi
              sleep 6
            done
            echo "Health check thất bại – rollback về $PREV_TAG"
            IMAGE_TAG=$PREV_TAG docker compose up -d
            exit 1
